<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SmartPath Coding · Mission</title>
<style>
@font-face{font-family:'Baloo 2';font-weight:800;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:700;src:url(fonts/baloo-2-latin-700-normal.woff2) format('woff2')}
:root{--ink:#1F2A44;--purple:#7B5CFF;--blue:#2EA8F5;--green:#4CC76A;--yellow:#FFC93C;--coral:#FF6B6B;--orange:#FF9F43;--soft:#F4F1FF;--mono:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-weight:700;color:var(--ink);background:#E8F6FF}
#bg{position:fixed;inset:0;background:#BFE6FF center/cover no-repeat}
#bg::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.55)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:clamp(6px,1.5vw,12px);padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));z-index:2;flex:none}
#close{width:clamp(40px,6vw,48px);height:clamp(40px,6vw,48px);min-width:40px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 10px rgba(31,42,68,.15);font:800 clamp(20px,3vw,24px) 'Baloo 2';color:var(--ink);cursor:pointer;display:grid;place-items:center}
#dots{flex:1;min-width:0;display:flex;gap:clamp(4px,1vw,8px);justify-content:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dot{width:clamp(14px,3.2vw,22px);height:clamp(14px,3.2vw,22px);flex:none;border-radius:50%;background:#fff;border:4px solid #C9D3E6}
.dot.on{border-color:var(--purple)}.dot.done{background:var(--green);border-color:var(--green)}
#stars{display:flex;gap:2px;background:#fff;border-radius:24px;padding:4px clamp(8px,1.6vw,12px);box-shadow:0 3px 10px rgba(31,42,68,.15);flex:none}
.star{width:clamp(22px,4.8vw,30px);height:clamp(22px,4.8vw,30px)}
#main{flex:1;display:flex;min-height:0;padding:0 max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:12px;z-index:1;position:relative}
#codi{width:clamp(100px,15vw,180px);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;flex:none}
#codi svg{width:100%;height:auto}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;gap:10px;justify-content:flex-start}
#bubble{background:#fff;border-radius:24px;padding:10px 16px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(31,42,68,.14);border:4px solid var(--purple);position:relative}
#bubble::before{content:'';position:absolute;left:-18px;bottom:16px;border:12px solid transparent;border-right:16px solid var(--purple)}
#say{flex:1;font-size:clamp(16px,2.4vw,28px);line-height:1.25}
#say .w{transition:color .1s}
#replay{flex:none;width:clamp(42px,5.5vw,52px);height:clamp(42px,5.5vw,52px);border-radius:50%;border:none;background:var(--purple);cursor:pointer;display:grid;place-items:center}
#replay svg{width:clamp(22px,3vw,28px);height:clamp(22px,3vw,28px)}
#task{flex:1 1 auto;min-height:0;background:rgba(255,255,255,.92);border-radius:28px;box-shadow:0 8px 24px rgba(31,42,68,.14);padding:clamp(10px,2vw,16px);display:flex;flex-direction:column;gap:10px;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.row{display:flex;flex-wrap:wrap;gap:clamp(8px,1.5vw,12px);justify-content:center;align-items:stretch}
.card{background:#fff;border:4px solid #DDE3F0;border-radius:clamp(16px,2.5vw,22px);padding:clamp(4px,1vw,8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;min-width:clamp(56px,14vw,96px);transition:transform .15s,border-color .15s,opacity .2s;position:relative}
.card:active{transform:scale(.96)}
.card img{width:clamp(48px,min(13vw,16vh),160px)!important;height:clamp(48px,min(13vw,16vh),160px)!important;object-fit:contain;pointer-events:none}
.card .lab{font-size:clamp(13px,1.8vw,19px);text-align:center;line-height:1.15}
.compact .card img{width:clamp(38px,min(9vw,11vh),90px)!important;height:clamp(38px,min(9vw,11vh),90px)!important}.compact .card{padding:4px 6px;min-width:clamp(48px,11vw,84px)}
.mcard img{width:clamp(36px,min(7vw,9vh),74px)!important;height:clamp(36px,min(7vw,9vh),74px)!important}.mcard{padding:4px 8px!important}
.card.sel{border-color:var(--purple);transform:scale(1.05);box-shadow:0 0 0 5px rgba(123,92,255,.2)}
.card.ok{border-color:var(--green);background:#EFFFF2}
.card.used{opacity:.25;pointer-events:none}
.card.bad,.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.slot{width:clamp(58px,14vw,140px);min-height:clamp(72px,16vw,160px);border:4px dashed #B9C3DA;border-radius:clamp(16px,2.5vw,22px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:rgba(255,255,255,.6)}
.slot .num{position:absolute;top:-12px;left:-8px;width:clamp(26px,5vw,36px);height:clamp(26px,5vw,36px);border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:clamp(15px,3vw,20px)}
.slot.full{border-style:solid;border-color:var(--green);background:#fff}
.slot img{width:75%;height:auto;max-height:100px;object-fit:contain}
.ph{display:flex;align-items:center;justify-content:center;border-radius:18px;background:#EDE7FF;color:var(--purple);font-size:14px;text-align:center;padding:6px}
.colorball{border-radius:50%;border:6px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.qmark{display:grid;place-items:center;font-size:60px;color:var(--purple)}
.bin{flex:1 1 140px;min-width:130px;max-width:360px;min-height:110px!important;border:4px solid var(--blue);border-radius:24px;background:#F3FAFF;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.bin .bh{display:flex;align-items:center;gap:6px;font-size:clamp(16px,2.2vw,22px)}
.bin .bh img{width:clamp(38px,6vw,54px);height:clamp(38px,6vw,54px);object-fit:contain}
.bin .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bin .got img{width:clamp(32px,5vw,44px)!important;height:clamp(32px,5vw,44px)!important;object-fit:contain}
.question{font-size:clamp(18px,2.5vw,28px);text-align:center;line-height:1.2}
/* code */
.code{background:var(--ink);border-radius:18px;padding:clamp(10px,2vw,14px) clamp(12px,2vw,16px);font-family:var(--mono);font-size:clamp(14px,1.9vw,22px);color:#E8EEF8;line-height:1.55;overflow-x:auto;-webkit-overflow-scrolling:touch}
.code .ln{display:flex;gap:12px;border-radius:10px;padding:0 8px;white-space:pre;cursor:default}
.code .ln .no{color:#5B6888;min-width:1.4em;text-align:right}
.code.tap .ln{cursor:pointer}.code.tap .ln:hover{background:rgba(255,255,255,.08)}
.code .ln.badline{background:rgba(255,107,107,.35)}.code .ln.goodline{background:rgba(76,199,106,.35)}
.blank{display:inline-block;min-width:3.5em;border-bottom:4px solid var(--yellow);text-align:center;color:var(--yellow)}
.k{color:#FF79C6}.s{color:#FFD866}.n{color:#FF9F5A}.c{color:#8A96AE}.t{color:#7FD4FF}.a{color:#4CC76A}
.blocks{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.blk{color:#fff;font-size:clamp(14px,1.9vw,21px);padding:7px 16px;border-radius:12px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);white-space:pre;cursor:pointer;min-height:38px;display:inline-flex;align-items:center}
.blk.hat{border-radius:26px 26px 12px 12px;padding-top:12px}
.blk.badline{outline:5px solid var(--coral)}.blk.goodline{outline:5px solid var(--green)}
.opt{font-family:var(--mono);font-size:clamp(14px,1.9vw,21px);background:#fff;border:4px solid #DDE3F0;border-radius:16px;padding:8px 14px;cursor:pointer;white-space:pre-wrap;text-align:left;min-height:42px;display:inline-flex;align-items:center}
.opt.word{font-family:inherit}
.opt.ok{border-color:var(--green);background:#EFFFF2}.opt.bad{animation:shake .45s;border-color:var(--coral)}
.pool{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.two{display:flex;gap:12px;flex-wrap:wrap}.two>*{flex:1;min-width:240px}
.output{border:4px solid var(--green);border-radius:20px;background:#fff;padding:12px 16px;animation:pop .45s}
.output .tag{display:inline-block;background:var(--green);color:#fff;border-radius:14px;padding:0 12px;font-size:16px;margin-bottom:6px}
.output pre{margin:0;font-family:var(--mono);font-size:clamp(15px,2vw,22px);white-space:pre-wrap}
.web{border-radius:16px;overflow:hidden;border:3px solid #DCE4F2;text-align:center}
.web .bar{background:#DCE4F2;height:28px;display:flex;gap:6px;align-items:center;padding:0 10px}.web .bar i{width:11px;height:11px;border-radius:50%;display:block}
.web h3{color:var(--purple);margin:10px 0 2px;font-size:28px}.web p{margin:4px 12px 10px;font-size:18px}
.web button{background:var(--coral);color:#fff;border:none;border-radius:20px;padding:6px 20px;font:800 18px 'Baloo 2';margin-bottom:12px}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
/* maze */
.mazewrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.grid{display:grid;gap:6px;background:#CFE8C3;padding:8px;border-radius:20px;position:relative}
.cell{background:#F4FBEF;border-radius:12px;position:relative;display:grid;place-items:center}
.cell img{width:85%;height:85%;object-fit:contain}
.avatar{position:absolute;transition:left .4s ease-in-out,top .4s ease-in-out;display:grid;place-items:center;pointer-events:none}
.avatar .face{transition:transform .35s}
.mazeside{display:flex;flex-direction:column;gap:10px;min-width:240px;flex:1;max-width:520px}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.cmd{border:none;color:#fff;border-radius:14px;padding:8px 14px;font:800 clamp(15px,1.9vw,20px) 'Baloo 2';cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);min-height:42px}
.prog{min-height:70px;background:#fff;border:4px dashed #B9C3DA;border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prog .cmd{padding:6px 10px;font-size:16px;min-height:36px}
.loopbox{border:4px solid var(--orange);border-radius:14px;padding:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#FFF4E6}
.loopbox .cnt{background:var(--orange);color:#fff;border-radius:10px;padding:2px 8px;font-size:16px;display:flex;gap:6px;align-items:center}
.loopbox .cnt b{cursor:pointer;background:rgba(255,255,255,.3);border-radius:6px;padding:0 6px}
.loopbox.open{box-shadow:0 0 0 4px rgba(255,159,67,.35)}
.go{background:var(--green);color:#fff;border:none;border-radius:18px;padding:10px 22px;font:800 clamp(18px,2.4vw,24px) 'Baloo 2';cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);min-height:46px;display:inline-flex;align-items:center;justify-content:center}
.ghost{background:#fff;color:var(--ink);border:3px solid #C9D3E6;border-radius:16px;padding:7px 14px;font:800 clamp(15px,1.9vw,18px) 'Baloo 2';cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center}
.chiprun{outline:4px solid var(--yellow)}
/* overlays */
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:#fff;border-radius:30px;padding:16px 36px;font-size:42px;box-shadow:0 10px 30px rgba(31,42,68,.25);transition:all .25s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#cover{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(237,231,255,.94);text-align:center;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));max-height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#cover h1{margin:0;font-size:clamp(26px,5vw,54px);line-height:1.1}
#cover .sub{font-size:clamp(16px,2.4vw,24px);color:#5B6888;max-width:min(820px,92vw);line-height:1.3}
#cover .pill{background:var(--purple);color:#fff;border-radius:20px;padding:3px 16px;font-size:17px}
.bigplay{width:clamp(90px,18vw,126px);height:clamp(90px,18vw,126px);border-radius:50%;border:none;background:var(--green);cursor:pointer;box-shadow:0 8px 0 #2E9E4F;display:grid;place-items:center;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.bigstars{display:flex;gap:8px}.bigstars svg{width:clamp(54px,12vw,86px);height:clamp(54px,12vw,86px);animation:pop .5s backwards}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:25}
.mouthA{animation:talk .18s infinite alternate}
@keyframes talk{from{ry:4px}to{ry:18px}}

@media (max-width:720px){
  #main{flex-direction:column;gap:8px}
  #stage{gap:8px}
  #codi{display:flex;width:clamp(46px,12vw,62px);height:clamp(46px,12vw,62px);position:absolute;left:max(10px,env(safe-area-inset-left));top:0;z-index:3}
  #bubble{margin-left:clamp(52px,13vw,68px);padding:6px 12px 6px 12px;border-radius:20px;min-height:50px}
  #bubble::before{left:-13px;bottom:8px;border-width:7px;border-right-width:13px}
  #say{font-size:clamp(14px,3.4vw,19px)}
  #task{border-radius:22px!important;padding:10px 8px;gap:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .two>*{min-width:0}
  .mazewrap{flex-direction:column;align-items:center;gap:10px}
  .mazeside{width:100%;min-width:0;max-width:100%}
  .palette{justify-content:center}
}
@media (max-width:440px){
  #top{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  #stars{padding:3px 6px}
  .two{grid-template-columns:1fr 1fr;gap:6px}
}

/* ===== Codi theme: SmartPath family (raised chunky cards, Baloo 2 + Nunito) with Codi's own identity:
   Codi purple + robot blue + name-plate yellow, a "code sky" with block-shaped clouds and circuit-trace hills ===== */
@font-face{font-family:'Nunito';font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
:root{--ink:#0F172A;--ink2:#475569;--purple:#7B5CFF;--purpleD:#5B3FD9;--lav:#EFE9FF;--lavB:#DCD0FF;--blue:#2EA8F5;--green:#22C55E;--greenD:#16A34A;--yellow:#FFC93C;--yellowD:#E0A800;--coral:#FF6B6B;--orange:#FF9F43}
html,body{font-family:'Nunito','Baloo 2',system-ui,sans-serif;font-weight:800;color:var(--ink);background:#CFEAFF}
h1,.question,#say,.lab,.go,.ghost,.cmd,#toast,.slot .num{font-family:'Baloo 2','Nunito',sans-serif}
#bg{background:linear-gradient(#9FD8FF 0%,#D6EEFF 55%,#F4FAFF 100%)!important}
#bg::after{background:none!important}
#bg .lessonbg{position:absolute;inset:0;background:center/cover no-repeat;opacity:.22}
#bg svg{position:absolute;left:0;right:0;width:100%;height:auto}
#task{background:#fff!important;border:3px solid var(--lavB);box-shadow:0 7px 0 #CDBEFF!important;border-radius:30px!important}
#bubble{border:3px solid var(--purple)!important;box-shadow:0 5px 0 var(--purpleD)!important}
#bubble::before{border-right-color:var(--purple)!important}
#replay{box-shadow:0 4px 0 var(--purpleD)}
#close{border:3px solid var(--lavB)!important;box-shadow:0 4px 0 #CDBEFF!important}
#stars{border:3px solid #FFE08A;box-shadow:0 4px 0 #F2C94C!important}
.dot{border-radius:7px!important;border-width:3px!important;background:#fff;border-color:#CDBEFF!important;transform:rotate(45deg) scale(.85)}
.dot.on{background:var(--yellow)!important;border-color:var(--yellowD)!important}.dot.done{background:var(--purple)!important;border-color:var(--purpleD)!important}
.card{border:3px solid var(--lavB)!important;box-shadow:0 6px 0 #CDBEFF;border-radius:24px!important}
.card:active{transform:translateY(4px)!important;box-shadow:0 2px 0 #CDBEFF}
.card.sel{border-color:var(--yellowD)!important;box-shadow:0 6px 0 var(--yellowD)!important;transform:translateY(-3px)!important}
.card.ok{border-color:#4ADE80!important;box-shadow:0 6px 0 var(--greenD)!important;background:#F0FDF4!important}
.slot{border-color:#CDBEFF!important;background:var(--lav)!important;border-radius:22px!important}
.slot .num{background:var(--purple)!important;box-shadow:0 3px 0 var(--purpleD)}
.slot.full{border-color:#4ADE80!important;background:#fff!important;box-shadow:0 5px 0 var(--greenD)}
.opt{border:3px solid var(--lavB)!important;box-shadow:0 5px 0 #CDBEFF;border-radius:18px!important}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #CDBEFF}
.opt.ok{border-color:#4ADE80!important;box-shadow:0 5px 0 var(--greenD)!important}
.bin{border:3px solid var(--blue)!important;box-shadow:0 6px 0 #1C86C9;background:#F0F9FF!important;border-radius:26px!important}
.code{border-radius:22px!important;box-shadow:0 6px 0 #0B1120}
.output{border:3px solid #4ADE80!important;box-shadow:0 6px 0 var(--greenD)}
.grid{background:#BDE8B5!important;box-shadow:0 6px 0 #8CCB82;border-radius:22px!important}
.cell{background:#F4FBEF!important}
.go{background:linear-gradient(135deg,#34D46F,#1FAE57)!important;box-shadow:0 6px 0 #148A43!important;border-radius:22px!important}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #148A43!important}
.ghost{border:3px solid var(--lavB)!important;box-shadow:0 4px 0 #CDBEFF}
.cmd{box-shadow:0 4px 0 rgba(0,0,0,.25)!important}
.bigplay{background:linear-gradient(135deg,#9B82FF,#6A4BF0)!important;box-shadow:0 10px 0 #4B32C2!important}
#cover{background:linear-gradient(#9FD8FF,#EFE9FF)!important}
#cover .pill{background:var(--yellow)!important;color:var(--ink)!important;box-shadow:0 3px 0 var(--yellowD)}
#toast{border:3px solid #FFE08A;box-shadow:0 8px 0 #F2C94C!important}

<script>
/* ===== config ===== */

  const side=el('div','mazeside'), pal=el('div','palette'), prog=el('div','prog'), ctl=el('div','row'); ctl.style.justifyContent='flex-start';
  const CMDS={F:['⬆ Forward','#2EA8F5'],L:['↰ Left','#FF9F43'],R:['↱ Right','#FF6B6B']};
  let P=[], openLoop=null, running=false;
  const place=(r,c,ang,inst)=>{ av.style.transition=inst?'none':''; av.style.left=(8+c*(cs+6))+'px'; av.style.top=(8+r*(cs+6))+'px'; av.querySelector('.arrow').style.transform=`rotate(${ang}deg)`; av.querySelector('.arrow').style.transition='transform .35s'; };
  const angOf=d=>({E:0,S:90,W:180,N:270})[d]; let ang=angOf(t.dir); place(t.start[0],t.start[1],ang,true);
  function drawProg(){ prog.innerHTML=''; if(!P.length) prog.innerHTML='<span style="color:#9AA3B5;padding:0 8px">Tap the blocks to build your program</span>';
    P.forEach((p,i)=>{ if(typeof p==='string'){ const b=el('button','cmd',CMDS[p][0]); b.style.background=CMDS[p][1]; b.onclick=()=>{ if(running) return; P.splice(i,1); drawProg(); }; p._n=b; prog.appendChild(b); }
      else { const lb=el('div','loopbox'+(p===openLoop?' open':'')); const cnt=el('span','cnt',`<b>−</b>Repeat ${p.repeat}<b>+</b>`); cnt.children[0].onclick=()=>{ if(p.repeat>2){p.repeat--; drawProg();} }; cnt.children[1].onclick=()=>{ if(p.repeat<9){p.repeat++; drawProg();} }; lb.appendChild(cnt);
        p.body.forEach((q,j)=>{ const b=el('button','cmd',CMDS[q][0]); b.style.background=CMDS[q][1]; b.onclick=()=>{ if(running) return; p.body.splice(j,1); drawProg(); }; lb.appendChild(b); });
        lb.ondblclick=()=>{ P.splice(i,1); if(openLoop===p) openLoop=null; drawProg(); }; prog.appendChild(lb); } }); drawPal(); }
  function drawPal(){ pal.innerHTML=''; t.palette.forEach(k=>{ if(k==='repeat'){ const b=el('button','cmd', openLoop?UI.endloop:'🔁 '+UI.loop); b.style.background='#FF8C1A'; b.onclick=()=>{ if(running) return; if(openLoop) openLoop=null; else { openLoop={repeat:2,body:[]}; P.push(openLoop); } SFX.step(); drawProg(); }; pal.appendChild(b); }
    else { const b=el('button','cmd',CMDS[k][0]); b.style.background=CMDS[k][1]; b.onclick=()=>{ if(running) return; (openLoop?openLoop.body:P).push(k); SFX.step(); drawProg(); }; pal.appendChild(b); } }); }
  const run=el('button','go','▶ '+UI.play), clr=el('button','ghost',UI.clear), und=el('button','ghost',UI.undo);
  clr.onclick=()=>{ if(running) return; P=[]; openLoop=null; drawProg(); }; und.onclick=()=>{ if(running) return; const last=P[P.length-1]; if(!last) return; if(typeof last!=='string'&&last.body.length&&last===openLoop) last.body.pop(); else { P.pop(); if(last===openLoop) openLoop=null; } drawProg(); };
  run.onclick=async()=>{ if(running||busy||!P.length) return; running=true; openLoop=null; drawProg(); let r=t.start[0], c=t.start[1], d=t.dir; ang=angOf(d); place(r,c,ang,true); await new Promise(z=>setTimeout(z,150));
    const steps=[]; P.forEach(p=>{ if(typeof p==='string') steps.push(p); else for(let k=0;k<p.repeat;k++) steps.push(...p.body); }); let crashed=false;
    for(const s of steps){ SFX.step(); if(s==='F'){ const nr=r+DIRS[d][0], nc=c+DIRS[d][1]; if(nr<0||nc<0||nr>=R||nc>=C||obst.some(o=>o.cell[0]===nr&&o.cell[1]===nc)){ crashed=true; av.classList.remove('bad'); void av.offsetWidth; av.classList.add('bad'); break; } r=nr; c=nc; place(r,c,ang); }
      else { const i=ORD.indexOf(d); d=ORD[(i+(s==='R'?1:3))%4]; ang+= s==='R'?90:-90; place(r,c,ang); } await new Promise(z=>setTimeout(z,480)); }
    const blocks=P.reduce((a,p)=>a+(typeof p==='string'?1:1+p.body.length),0), loop=P.some(p=>typeof p!=='string');
    if(crashed){ mistakes++; taskMistakes++; SFX.oops(); toast(UI.crash); await (taskMistakes>1? speak(t.hint,`h${ti}`) : sayCommon('crash')); place(t.start[0],t.start[1],ang=angOf(t.dir),true); }
    else if(r!==t.goal.cell[0]||c!==t.goal.cell[1]){ mistakes++; taskMistakes++; SFX.oops(); await (taskMistakes>1? speak(t.hint,`h${ti}`) : sayCommon('notyet')); place(t.start[0],t.start[1],ang=angOf(t.dir),true); }
    else if(t.needLoop && !loop){ SFX.pop(); await sayCommon('useloop'); place(t.start[0],t.start[1],ang=angOf(t.dir),true); }
    else if(blocks>t.maxBlocks){ SFX.pop(); await sayCommon('fewer'); place(t.start[0],t.start[1],ang=angOf(t.dir),true); }
    else { running=false; confetti(); return solved(); }
    running=false; };
  ctl.append(run, und, clr); side.append(pal, prog, ctl); wrap.append(grid, side); box.append(wrap); drawProg(); };
T.unknown = (t, box) => { box.innerHTML='<div class="question">This activity is coming soon.</div>'; setTimeout(()=>solved(),1500); };
/* ===== confetti ===== */
function confetti(){ const cv=$('#conf'), x=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight; const P=[...Array(120)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*200,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,c:['#FFC93C','#FF6B6B','#2EA8F5','#4CC76A','#7B5CFF'][Math.floor(Math.random()*5)],r:Math.random()*6}));
  let f=0; (function step(){ x.clearRect(0,0,cv.width,cv.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-6,-4,12,8); x.restore(); }); if(++f<200) requestAnimationFrame(step); else x.clearRect(0,0,cv.width,cv.height); })(); }
/* ===== start / finish ===== */
async function finish(){ const n=starsFor(mistakes), secs=Math.round((Date.now()-t0)/1000); dots(); SFX.tada(); confetti();
  const cv=$('#cover'); cv.style.display='flex'; cv.innerHTML=`<h1>${esc(UI.done)}</h1><div class="bigstars">${[0,1,2].map(i=>`<div style="animation-delay:${i*.25}s">${STAR(i<n).replace('class="star"','')}</div>`).join('')}</div>
    <div class="sub">${esc(M.title||'')}</div><div class="row"><button class="go" id="nx">${esc(UI.next)} ▶</button><button class="ghost" id="ag">${esc(UI.again)}</button></div>`;
  cv.querySelectorAll('.bigstars svg').forEach(s=>{ s.setAttribute('width',90); s.setAttribute('height',90); });
  emit({type:'missionComplete', stars:n, mistakes, seconds:secs});
  $('#nx').onclick=()=>emit({type:'next'}); $('#ag').onclick=()=>{ cv.style.display='none'; start(); };
  await speak(M.outro,'outro'); await sayCommon('star'+n); }
function start(){ ti=0; mistakes=0; t0=Date.now(); runTask(); }
$('#close').onclick=()=>emit({type:'close', task:ti});
const loadJS = src => new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
async function getData(dir, key){ try{ return await fetch(`${CFG.base}${dir}/${CFG.id}.json`).then(r=>{ if(!r.ok) throw 0; return r.json(); }); }
  catch(e){ await loadJS(`${CFG.base}${dir}/${CFG.id}.js`); return window[key]; } } // .js fallback works from file:// too
async function boot(){ M = window.MISSION || await getData('missions','MISSION');
  try{ const L = window.LESSON_META || await getData('lessons','LESSON_META'); M.title=M.title||L.title; M.mission=M.mission||L.mission;
    M.bg = M.bg || (L.scenes.find(s=>!['algorithm','play','grid_bg'].includes(s.bg))||{}).bg; }catch(e){}
  if(M.bg) $('#bg .lessonbg').style.backgroundImage=`url(${BG(M.bg)})`;
  const cv=$('#cover'); cv.innerHTML=`<span class="pill">${esc(UI.mission)} · ${esc(CFG.id)}</span><h1>${esc(M.title||'')}</h1><div class="sub">${esc(M.mission||'')}</div>
    <button class="bigplay" id="go" aria-label="${esc(UI.start)}"><svg width="60" height="60" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg></button>`;
  $('#go').onclick=async()=>{ cv.style.display='none'; SFX.pop(); dots(); drawStars(); showSay(M.intro); emit({type:'missionStart'}); await speak(M.intro,'intro'); start(); };
  emit({type:'ready'}); }
boot();
</script></body></html>
