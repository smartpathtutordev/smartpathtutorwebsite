<!--
================================================================================================
 STAGE ENGINE  (engine id "stage")  ·  block-coding Creative Playground for Levels 1 and 2
================================================================================================
 A touch-first mini Scratch. Kids tap blocks from the palette into the selected sprite's code,
 tap chips to change values (pickers, no typing needed) and press the green flag.

 CONFIG  (playgrounds_src/L1.json / L2.json -> { "<lesson id>": config })
 {
   "engine": "stage",
   "bg": "page background name (optional, shell)",
   "challenge": "...", "ideas": [...], "badge": { "name","img","color","say","checks":[ CHECK, ... ] },
   "blocks":  [ ...palette filter... ],     optional; op ids and/or category names (see BLOCK OPS). Omitted = every block.
                                            Blocks used by the starter project always run and stay editable even if filtered.
   "phrases": [ "Kumusta!", ... ],           optional; extra say/think choices shown first (kids may also type their own)
   "keys":    true,                          optional; always show the on-screen arrow pad (auto-shown when key blocks are used)
   "library": { "props": [prop, ...], "backdrops": [bg, ...] },   optional; what kids can add with + Sprite / Backdrop
   "project": PROJECT                        the starter project (must run right away when the green flag is pressed)
 }

 PROJECT  (also the saved format, PG.save/PG.load)
 {
   "backdrops": ["l1_beach", "park"],        backdrop names (art/bg_<name>.png; drawn with a soft fallback if missing)
   "backdrop":  "l1_beach",                  the backdrop shown at start
   "vars":      { "score": 0, "lives": 3 },  (L2) variables and their start values; every green flag resets them to these
   "monitors":  ["score", "lives"],          (L2) variables shown on the stage
   "sprites": [ {
       "name": "Cat",                        unique, shown on chips (other sprites refer to it by this name)
       "props": ["l1_cat", "l1_cat_jump"],   costumes (prop pictures); first is costume 0
       "costume": 0, "x": 0, "y": 0,         stage is x -240..240, y -180..180 (0,0 = centre, y up)
       "size": 100, "dir": 90,               size in %, a sprite at 100 is about 100 px of a 480 px stage; dir 90 = right, 0 = up
       "shown": true, "rotate": "all",       rotate: "all" (all around) | "lr" (left-right flip) | "none"
       "scripts": [ [ BLOCK, BLOCK, ... ], ... ]   each script is a list; a script runs only if its first block is a hat
   } ]
 }
 Every green flag first puts sprites back to their saved spot/size/costume/visibility (the "home" state above),
 resets variables and the backdrop, then starts all flag scripts. Dragging a sprite while nothing runs moves its home.

 BLOCK  = { "op": "<op>", "args": { ... }, "body": [BLOCK...], "else": [BLOCK...] }   (body for C-blocks, else for ifelse)
 VALUES = number | string | REPORTER     REPORTER = { "r": "<reporter op>", ...its args }
 BOOL   = BOOLEAN REPORTER or null

 BLOCK OPS   (category: op  "template"  args)
  events:    flag "when green flag clicked" (hat) · tap "when this sprite tapped" (hat) · key "when {k} key pressed" (hat)
             touch "when I touch {who}" (hat, fires when touching starts) · receive "when I receive {m}" (hat) · broadcast "broadcast {m}"
  motion:    move {n} · turnr {n} · turnl {n} · goto {to} · gotoxy {x}{y} · glide {s}{to} · glidexy {s}{x}{y} · point {d}
             pointto {to} · changex {n} · changey {n} · setx {n} · sety {n} · bounce · rotstyle {r}
  looks:     sayfor {t}{s} · say {t} · thinkfor {t}{s} · think {t} · costume {prop} · nextcos · bd {backdrop} · nextbd
             sizeby {n} · size {n} · effect {e}{n} · cleareff · show · hide · front
  sound:     play {snd} (until done) · start {snd} · note {nt}{s} · stopsnd
  control:   wait {s} · repeat {n} [body] · forever [body] · if {c} [body] · ifelse {c} [body][else] · waituntil {c}
             until {c} [body] · stop {w}
  sensing:   resettimer · reporters: touching {who} (bool) · keyp {k} (bool) · timer · xpos · ypos
  operators: reporters: add {a}{b} · sub {a}{b} · rand {a}{b} · gt {a}{b} · lt {a}{b} · eq {a}{b} · and {a}{b} · or {a}{b} · not {a}
  variables: setvar {v}{n} · changevar {v}{n} · showvar {v} · hidevar {v} · reporter: var {v}
  pen:       pendown · penup · pencolor {col} · pensize {n} · clear      (trails are wiped at every green flag)
  arg values: k = "space" | "up" | "down" | "left" | "right" | "any";  who = sprite name | "edge";
             to = sprite name | "random" | "center" | "top" | "bottom" | "left" | "right" | "start" (the sprite's home spot);
             snd = pop ding boom crow meow bark tweet ring twinkle fiesta coin boing whoosh clap buzz tada;
             nt = do re mi fa sol la ti hido;  e = color | ghost;  col = red orange yellow green blue purple pink white black;  r = all | lr | none;  w = all | this;
             m = any short message name (e.g. "Go!");  v = a name from project.vars;  prop = one of the sprite's props;
             backdrop = one of project.backdrops;  t = text or REPORTER;  numbers may be REPORTERs.
  Category names usable in "blocks": events motion looks sound control sensing operators variables pen.

 CHECK  (badge goals: { "id", "text" (kid-facing goal), "type", ...rule fields }; evaluated live; "by" = optional sprite name filter; "min" defaults to 1)
  { "type": "run",      "op": op | [ops], "by"?, "inside"?: op | [ops], "min"?, "sprites"? }  block(s) executed while running
                        (inside = within that repeat/forever/if/ifelse/until; sprites = how many different sprites ran them)
  { "type": "has",      "op": op | [ops], "by"?, "min"? }      the program contains these blocks (in scripts that start with a hat)
  { "type": "blocks",   "min": 5 }                                 the program has at least min blocks under hats
  { "type": "hats",     "min": 3 }                                 at least min different kinds of event hats are used
  { "type": "event",    "hat": "flag"|"tap"|"key"|"touch"|"receive", "min"? }   such an event really started a script
  { "type": "said",     "by"?, "says"?, "min"? }               a sprite said or thought something (min different texts; says = must contain)
  { "type": "talk",     "min"?: 2, "turns"?: min, "gap"?: 1, "clean"?: false }   in one run, min different sprites spoke taking turns: a turn
                        counts when a different sprite starts speaking after the last speaker's bubble ended and at least gap secs later;
                        turns = how many turns are needed; clean = nobody may talk over another sprite in that run
  { "type": "order",    "first": "hello", "then": "goodbye", "by"? }   in one run, a message containing first and later one containing then
  { "type": "bounced",  "min"? }                                   sprites really bounced off the edge min times
  { "type": "stopped",  "min"? }                                   the kid pressed stop while code was running
  { "type": "costumes", "min"?: 2, "sprites"?: 1 }                 at least "sprites" sprites have min costumes (add costumes in the sprite menu)
  { "type": "var",      "name": "score", "op": ">="|"<="|"=", "value": 10 } a variable reached a value while running
  { "type": "touch",    "a"?: name, "b"?: name }                   two sprites touched (any two if not given)
  { "type": "backdrop", "min": 3 }                                 code switched to min different backdrops
  { "type": "costume",  "min": 4 }                                 code changed costumes min times
  { "type": "sprites",  "min": 3 }                                 the project has min sprites
  { "type": "edit",     "min"? }                                   the kid changed the project min times (any edit)
  { "type": "drag",     "min"? }                                   the kid dragged sprites on the stage
  { "type": "flag",     "min"? }                                   the green flag was pressed min times
 Test hook: window.STG exposes { project, RT, flag(), stop(), add(op), sel(i), state() }.
================================================================================================
-->
<style>
:root{--ink:#1F2A44}
#pg-root{gap:10px;padding:8px 10px 8px;user-select:none;-webkit-user-select:none}
#ed{flex:1;min-width:0;min-height:0;display:flex;gap:8px}
#cats{width:68px;flex:none;display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding:2px 2px 130px}
.cat{border:none;background:#fff;border-radius:16px;padding:6px 2px 4px;font:800 12px/1 'Baloo 2';color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 2px 6px rgba(31,42,68,.12);flex:none}
.cat i{width:28px;height:28px;border-radius:50%;display:block;border:3px solid rgba(255,255,255,.8);box-shadow:0 0 0 2px rgba(31,42,68,.08)}
.cat.on{box-shadow:0 0 0 3px var(--purple)}
#pal>*,.stack>*,.bd>*,#scripts>*{flex-shrink:0}
#pal{width:clamp(220px,22vw,290px);flex:none;overflow-y:auto;background:rgba(255,255,255,.88);border-radius:22px;padding:8px 10px 150px;box-shadow:0 6px 18px rgba(31,42,68,.1);display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.ph2{font-size:17px;margin:8px 2px 0;color:#5B6888;display:flex;align-items:center;gap:6px;width:100%}.ph2 i{width:14px;height:14px;border-radius:50%}
.ph2 button{margin-left:auto}
#code{flex:1;min-width:0;display:flex;flex-direction:column;background:rgba(255,255,255,.93);border-radius:22px;box-shadow:0 6px 18px rgba(31,42,68,.1);overflow:hidden}
#codehd{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:3px solid #EEF1F8;flex-wrap:wrap}
#codehd .who{display:flex;align-items:center;gap:6px;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
#codehd .who span:last-child{overflow:hidden;text-overflow:ellipsis}
#tools{display:flex;gap:5px;flex:none}
#codehd .who .thumb{width:36px;height:36px;flex:none}
.tb{width:42px;height:42px;border-radius:14px;border:3px solid #DDE3F0;background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.tb:disabled{opacity:.3;cursor:default}.tb svg{width:24px;height:24px}
.tb.del{border-color:#FFC9C9}
#scripts{flex:1;overflow:auto;padding:12px 10px 90px 12px;background-color:#FBFCFF;background-image:radial-gradient(#DDE3F0 1.4px,transparent 1.6px);background-size:22px 22px}
.stack{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-bottom:26px;position:relative}
.stack.loose{opacity:.72}
.loosetag{font-size:13px;color:#8A96AE;background:#fff;border:2px dashed #C9D3E6;border-radius:10px;padding:0 8px;margin-bottom:2px}
.empty{color:#8A96AE;font-size:18px;text-align:center;padding:30px 10px;line-height:1.3}
/* blocks */
.blk{color:#fff;font:800 16px/1.15 'Baloo 2';padding:7px 12px 9px;border-radius:12px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);display:flex;align-items:center;flex-wrap:wrap;gap:5px;cursor:pointer;position:relative;max-width:100%;min-height:40px;transition:transform .12s}
.blk.hat{border-radius:26px 26px 12px 12px;padding-top:13px;min-width:150px}
.blk:active{transform:scale(.97)}
.cb{border-radius:12px;display:flex;flex-direction:column;max-width:100%;min-width:160px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);cursor:pointer}
.cb>.blk{box-shadow:none;background:transparent!important}
.cb>.bd{margin-left:18px;background:#FBFCFF;border-radius:10px 0 0 10px;padding:4px 4px 4px 6px;min-height:36px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;cursor:default}
.cb>.ft{height:16px}
.cb>.mid{padding:2px 12px;font:800 16px 'Baloo 2';color:#fff}
.cap>.ft{border-radius:0 0 12px 12px}
.chip{background:#fff;color:var(--ink);border-radius:999px;padding:1px 10px;min-width:30px;text-align:center;font-size:15px;line-height:1.5;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);display:inline-flex;align-items:center;gap:4px;max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.ch{background:rgba(0,0,0,.2);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.chip.ch::after{content:'';border:5px solid transparent;border-top:6px solid #fff;margin-top:5px}
.chip img{width:22px;height:22px;object-fit:contain}
.chip.hole{background:rgba(0,0,0,.18);min-width:44px;height:24px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);border-radius:0}
.rp{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;color:#fff;font-size:15px;box-shadow:0 0 0 2px rgba(255,255,255,.55);flex-wrap:wrap}
.rp.b{border-radius:0;padding:3px 16px;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);box-shadow:none}
.flagi{width:22px;height:22px;vertical-align:middle}
#scripts .chip,#scripts .rp{cursor:pointer}
#scripts .chip:active{transform:scale(.93)}
.sel{outline:4px solid var(--ink);outline-offset:2px;z-index:1}
.cb.sel>.blk{outline:none}
.now{box-shadow:0 0 0 4px #FFE36E,0 0 14px 4px rgba(255,201,60,.9)!important}
.stack.run>:first-child{filter:drop-shadow(0 0 7px rgba(255,201,60,.95))}
.ins{height:12px;width:150px;border-radius:7px;background:var(--yellow);position:relative;animation:blink 1s infinite;flex:none;margin:1px 0}
.ins::before{content:'';position:absolute;left:-11px;top:-3px;border:9px solid transparent;border-left:11px solid var(--yellow)}
@keyframes blink{50%{opacity:.35}}
.slot{height:34px;min-width:120px;border:3px dashed rgba(31,42,68,.22);border-radius:10px;cursor:pointer;color:#A3AEC6;font-size:13px;display:flex;align-items:center;padding:0 8px}
.pop{animation:popin .35s}
@keyframes popin{0%{transform:scale(.6)}70%{transform:scale(1.07)}100%{transform:scale(1)}}
#pal .blk,#pal .cb{cursor:pointer}
#pal .cb{min-width:140px}#pal .cb>.bd{min-height:22px;padding:2px}#pal .cb>.ft{height:12px}
#pal .rp{font-size:16px;padding:6px 12px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
#pal .rp.b{padding:7px 20px}
/* side (stage) */
#side{flex:none;width:var(--sw,480px);display:flex;flex-direction:column;gap:8px;min-height:0}
#bar{display:flex;gap:8px;align-items:center}
.big{height:52px;min-width:56px;border:none;border-radius:18px;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);padding:0 10px}
.big svg{width:30px;height:30px}
#go{background:var(--green)}#go.pulse{animation:pulse 1.4s infinite}#go.on{box-shadow:0 0 0 4px #FFE36E,inset 0 -5px 0 rgba(0,0,0,.18)}
@keyframes pulse{50%{transform:scale(1.1)}}
#stopb{background:var(--coral)}
#bar .tb{height:52px;width:52px;border-radius:18px}
#bar .sp{flex:1}
#stagewrap{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(31,42,68,.18);background:#BFE6FF;flex:none;touch-action:none;border:4px solid #fff}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#mons{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.mon{background:rgba(255,255,255,.92);border-radius:12px;padding:1px 4px 1px 10px;font-size:clamp(13px,1.6vw,17px);display:flex;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(31,42,68,.15)}
.mon b{background:#FF6B6B;color:#fff;border-radius:9px;padding:0 8px;min-width:32px;text-align:center}
#pad{display:none;gap:6px;justify-content:center;align-items:center}
#pad.show{display:flex}
#pad button{width:56px;height:48px;border:none;border-radius:14px;background:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 2px 8px rgba(31,42,68,.12);display:grid;place-items:center;cursor:pointer;font:800 16px 'Baloo 2';color:var(--ink);touch-action:none}
#pad button.on{background:var(--yellow)}
#pad button.space{width:96px}
#pad svg{width:26px;height:26px}
#sprites{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 6px;flex:none;align-items:stretch}
.tile{flex:none;width:84px;border:4px solid #DDE3F0;background:#fff;border-radius:18px;padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;position:relative;font-size:13px;line-height:1.1;text-align:center}
.tile .tp{width:52px;height:52px;display:grid;place-items:center;overflow:hidden;border-radius:10px}
.tile .tp img{width:52px;height:52px;object-fit:contain}
.tile .tp canvas{width:52px;height:52px}
.tile.on{border-color:var(--purple);box-shadow:0 0 0 3px rgba(123,92,255,.25)}
.tile .gear{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--purple);display:none;place-items:center}
.tile.on .gear{display:grid}.tile .gear svg{width:16px;height:16px}
.tile.hid .tp{opacity:.35}
.tile.add{border-style:dashed;justify-content:center;color:var(--purple);font-size:15px}
.tile.add b{font-size:30px;line-height:1}
.tile.bdt .tp{width:70px;border-radius:8px}.tile.bdt .tp canvas{width:70px;height:52px}
/* big stage mode */
body.bigstage #ed{display:none}body.bigstage #side{width:var(--bw)!important;margin:0 auto}
/* picker */
#pk{position:fixed;inset:0;z-index:15;background:rgba(31,42,68,.35);display:none;align-items:flex-end;justify-content:center;padding:10px}
#pk.show{display:flex}
#pk .card{background:#fff;border-radius:28px;max-width:600px;width:100%;max-height:86vh;overflow:auto;padding:14px 16px 16px;box-shadow:0 12px 40px rgba(31,42,68,.3);display:flex;flex-direction:column;gap:10px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#pk .hd{display:flex;align-items:center;gap:10px;font-size:22px}
#pk .hd .x{margin-left:auto;width:44px;height:44px;border-radius:50%;border:none;background:#F1F4FA;font:800 20px 'Baloo 2';cursor:pointer;color:var(--ink)}
#pk .hd i{width:18px;height:18px;border-radius:50%;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.opt{border:3px solid #DDE3F0;background:#fff;border-radius:16px;padding:8px 6px;font:800 17px/1.15 'Baloo 2';color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center;text-align:center}
.opt.on{border-color:var(--purple);background:#F4F1FF}
.opt img,.opt .phc{width:64px;height:64px;object-fit:contain}
.opt .bdp{width:96px;height:72px;border-radius:10px}
.opt:active{transform:scale(.96)}
.lbl{font-size:15px;color:#5B6888;margin-top:2px}
.numrow{display:flex;gap:8px;align-items:center;justify-content:center}
.numrow .val{min-width:120px;text-align:center;font-size:40px;background:#F4F1FF;border-radius:18px;padding:0 16px;border:3px solid var(--purple)}
.nb{min-width:58px;height:54px;border:none;border-radius:16px;background:#EEF1F8;font:800 22px 'Baloo 2';color:var(--ink);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.nb:active{transform:scale(.94)}
.pad3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.okb{background:var(--green);color:#fff;border:none;border-radius:18px;padding:10px 22px;font:800 22px 'Baloo 2';cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.rowc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.txtin{font:800 22px 'Baloo 2';border:3px solid var(--purple);border-radius:14px;padding:6px 12px;flex:1;min-width:0;color:var(--ink)}
.rch{border:none;border-radius:999px;padding:6px 14px;color:#fff;font:800 17px 'Baloo 2';cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
/* segmented switch for mobile & tablet */
#stg-seg{display:none;gap:6px;padding:4px 8px 0;justify-content:center;flex:none}
#stg-seg button{flex:1;max-width:180px;border:3px solid #C9D3E6;background:#fff;color:var(--ink);border-radius:14px;padding:6px 10px;font:800 15px 'Baloo 2';cursor:pointer;min-height:38px;box-shadow:0 3px 0 var(--lavE,#CDBEFF)}
#stg-seg button.on{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 3px 0 var(--purpleD,#5B3FD9)}

/* narrow / phone */
@media (max-width:840px){
  #stg-seg{display:flex}
  #pg-root{flex-direction:column;padding:6px 6px 6px;gap:6px}
  #side{width:100%!important;align-items:center}
  #stagewrap{width:min(100%,480px);max-height:calc(100vh - 240px);margin:0 auto}
  #ed{flex-direction:column;gap:6px;flex:1;min-height:0}
  #cats{flex-direction:row;width:auto;overflow-x:auto;overflow-y:hidden;padding:2px 2px 4px;gap:5px;-webkit-overflow-scrolling:touch}
  .cat{flex-direction:row;padding:4px 10px 4px 5px;font-size:14px;gap:5px}.cat i{width:22px;height:22px}
  #work{display:flex;gap:6px;flex:1;min-height:0}
  #pal{width:clamp(140px,44vw,260px);padding:6px 6px 140px;border-radius:18px}
  #code{border-radius:18px;flex:1;min-width:0}
  .blk{font-size:14px;padding:5px 8px 7px;min-height:34px;gap:4px}.chip,.rp{font-size:13px}.blk.hat{min-width:0}
  .cb{min-width:110px}.cb>.bd{margin-left:12px;min-height:30px}.cb>.mid{font-size:14px}
  #pal .rp{font-size:14px}
  .tb{width:36px;height:36px;border-radius:11px;border-width:2px}.tb svg{width:19px;height:19px}#tools{gap:3px}
  #codehd .who{font-size:15px;min-width:0;flex-basis:100%}
  #codehd .who .thumb{width:26px;height:26px}
  #scripts{padding:8px 6px 80px 10px}
  #row2{display:flex;gap:6px;width:100%;align-items:center}
  #bar{gap:5px}.big{height:46px;min-width:46px;padding:0 6px;border-radius:14px}.big svg{width:24px;height:24px}#bar .tb{height:46px;width:46px;border-radius:14px}

  P.sprites.forEach(sp => { if (spName && sp.name !== spName) return; hatScripts(sp).forEach(s => { hats.add(s[0].op); walk(s, b => { out[b.op] = (out[b.op] || 0) + 1; total++; const scan = o => { if (o && typeof o === 'object') { if (o.r) out[o.r] = (out[o.r] || 0) + 1; Object.values(o).forEach(scan); } }; scan(b.args); }); }); });
  return { out, total, hats }; }
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
const CHECK = {
  run: c => { const min = c.min || 1; let n = 0; const who = new Set();
    for (const op of opsList(c)) for (const m of (c.inside ? [].concat(c.inside).map(o => ST.inside[op + '<' + o]) : [ST.ran[op]])) { if (!m) continue; n += sumRan(m, c.by); Object.keys(m).forEach(k => (!c.by || k === c.by) && who.add(k)); }
    return n >= min && who.size >= ((c.sprites ?? c.bys) || 1); },
  has: c => { const { out } = staticOps(c.by); return opsList(c).reduce((a, op) => a + (out[op] || 0), 0) >= (c.min || 1); },
  blocks: c => staticOps().total >= (c.min || 1),
  hats: c => staticOps().hats.size >= (c.min || 1),
  event: c => (ST.events[c.hat] || 0) >= (c.min || 1),
  said: c => { const set = new Set(ST.speech.filter(s => (!c.by || s.who === c.by) && (!c.says || norm(s.t).includes(norm(c.says)))).map(s => s.t)); return set.size >= (c.min || 1); },
  talk: c => { const gap = (c.gap ?? 1) * 1000 - 50, min = c.min || 2, turns = c.turns || min; const runs = {};
    ST.speech.forEach(s => (runs[s.run] = runs[s.run] || []).push(s));
    return Object.values(runs).some(sp => { sp = sp.slice().sort((a, b) => a.at - b.at); let t = 0, cur = null, overlap = false; const who = new Set();
      sp.forEach((s, i) => { for (let j = 0; j < i; j++) if (sp[j].who !== s.who && s.at < (sp[j].end ?? Infinity) - 250 && s.at - sp[j].at > 100) overlap = true;
        if (cur === null) { cur = s.who; t = 1; who.add(s.who); return; }
        if (s.who === cur) return;   /* a reply counts when it starts after one of the current speaker's lines has ended */
        if (sp.some(L => L.who === cur && L.at <= s.at - gap && s.at >= (L.end ?? Infinity) - 250)) { t++; cur = s.who; who.add(s.who); } });
      return who.size >= min && t >= turns && !(c.clean && overlap); }); },
  order: c => { const sp = ST.speech.filter(s => !c.by || s.who === c.by); return sp.some((a, i) => norm(a.t).includes(norm(c.first)) && sp.slice(i + 1).some(b => b.run === a.run && norm(b.t).includes(norm(c.then)))); },
  bounced: c => ST.bounces >= (c.min || 1),
  stopped: c => ST.stops >= (c.min || 1),
  costumes: c => P.sprites.filter(s => s.props.length >= (c.min || 2)).length >= ((c.sprites ?? c.bys) || 1),
  var: c => { const s = ST.varSeen[c.name]; if (!s) return false; const v = Number(c.value); if (c.op === '<=') return s.min <= v; if (c.op === '=') return s.vals.has(String(c.value)); return s.max >= v; },
  touch: c => Object.keys(ST.touches).some(k => { const [a, b] = k.split('|'); return (!c.a || a === c.a || b === c.a) && (!c.b || a === c.b || b === c.b) && (!(c.a && c.b) || (k === [c.a, c.b].sort().join('|'))); }),
  backdrop: c => ST.bds.size >= (c.min || 1),
  costume: c => ST.cos >= (c.min || 1),
  sprites: c => P.sprites.length >= (c.min || 1),
  edit: c => ST.edits >= (c.min || 1),
  drag: c => ST.drags >= (c.min || 1),
  flag: c => ST.flags >= (c.min || 1),
};
const doneSet = new Set();
function checkAll() { if (!CFG || !CFG.badge) return; for (const c of CFG.badge.checks || []) { if (doneSet.has(c.id)) continue; let ok = false; try { ok = CHECK[c.type] ? CHECK[c.type](c) : false; } catch (e) {} if (ok) { doneSet.add(c.id); PG.done(c.id); } } }

/* ============================== layout ============================== */
function layout() {
  const root = PG.root; if (!root) return; const W = root.clientWidth, H = root.clientHeight; const narrow = innerWidth <= 820;
  const padH = $('#pad').classList.contains('show') ? 56 : 0;
  let sw;
  if (narrow) { sw = Math.min(W - 20, (H * .44 - padH * .5) * 4 / 3); }
  else { sw = Math.min(W * .41, (H - 60 - 100 - padH - 30) * 4 / 3); }
  sw = Math.max(200, Math.floor(sw)); document.documentElement.style.setProperty('--sw', sw + 'px');
  document.documentElement.style.setProperty('--bw', Math.floor(Math.min(W - 20, (H - 60 - 100 - padH - 30) * 4 / 3)) + 'px');
  requestAnimationFrame(sizeCanvas);
}

/* ============================== boot ============================== */
function validProject(p) { return p && Array.isArray(p.sprites) && p.sprites.length && p.sprites.every(s => Array.isArray(s.props) && s.props.length && Array.isArray(s.scripts)); }
function fillProject(p) { p.backdrops = p.backdrops && p.backdrops.length ? p.backdrops : [p.backdrop || 'park']; p.backdrop = p.backdrop || p.backdrops[0]; p.vars = p.vars || {}; p.monitors = p.monitors || [];
  p.sprites.forEach(s => { s.costume = s.costume || 0; s.x = s.x || 0; s.y = s.y || 0; s.size = s.size || 100; s.dir = s.dir ?? 90; if (s.shown === undefined) s.shown = true; s.rotate = s.rotate || 'all'; s.scripts = s.scripts || []; }); return p; }
function renderAll() { renderSprites(); renderPalette(); renderCode(); renderMonitors(); updatePad(); dirty = true; }
function buildUI() {
  PG.root.innerHTML = `
  <div id="stg-seg"><button class="on" data-v="code">💻 Blocks &amp; Code</button><button data-v="stage">🎮 Stage &amp; Play</button><button data-v="split">⬚ Split</button></div>
  <div id="ed"><div id="cats"></div><div id="work"><div id="pal"></div>
    <div id="code"><div id="codehd"><div class="who"></div>
      <div id="tools"><button class="tb" id="bUndo" aria-label="Undo">${ICON.undo}</button><button class="tb" id="bUp" aria-label="Move up">${ICON.up}</button><button class="tb" id="bDown" aria-label="Move down">${ICON.down}</button>
      <button class="tb" id="bCopy" aria-label="Copy">${ICON.copy}</button><button class="tb del" id="bDel" aria-label="Delete">${ICON.trash}</button></div></div>
      <div id="scripts"></div></div></div></div>
  <div id="side">
    <div id="stagewrap"><canvas id="cv"></canvas><div id="mons"></div></div>
    <div id="pad"></div>
    <div id="row2"><div id="bar"><button class="big pulse" id="go" aria-label="Green flag">${ICON.flagw}</button><button class="big" id="stopb" aria-label="Stop">${ICON.stop}</button>
      <button class="tb" id="resetb" aria-label="Reset to starter">${ICON.reset}</button><span class="sp"></span><button class="tb" id="bigb" aria-label="Big stage">${ICON.big}</button></div>
    <div id="sprites"></div></div>
  </div>`;
  document.body.classList.add('v-code');
  $('#stg-seg').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    PG.sfx.pop();
    $('#stg-seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    document.body.classList.remove('v-code', 'v-stage', 'v-split');
    document.body.classList.add('v-' + b.dataset.v);
    requestAnimationFrame(sizeCanvas);
    layout();
  };
  // on wide screens the bar sits above the stage
  if (innerWidth > 840) $('#side').prepend($('#bar'));
  cv = $('#cv'); ctx = cv.getContext('2d');
  cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove); cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
  $('#go').onclick = () => { greenFlag(); };
  $('#stopb').onclick = () => stopAll();
  $('#resetb').onclick = resetSheet;
  $('#bigb').onclick = () => { document.body.classList.toggle('bigstage'); layout(); };
  $('#bUndo').onclick = undo; $('#bUp').onclick = () => moveSel(-1); $('#bDown').onclick = () => moveSel(1); $('#bCopy').onclick = dupSel; $('#bDel').onclick = delSel;
  $('#scripts').onclick = e => { if (e.target.id === 'scripts') { selB = null; const sp = curSprite(); const last = sp && sp.scripts[sp.scripts.length - 1]; cursor = last ? { list: last, idx: last.length } : null; renderCode(); } };
  document.body.appendChild(el('div', '', '')).id = 'pk';
  buildPad();
  addEventListener('resize', () => { const wide = innerWidth > 840; if (wide && $('#bar').parentElement.id !== 'side') $('#side').prepend($('#bar')); if (!wide && $('#bar').parentElement.id === 'side') $('#row2').prepend($('#bar')); layout(); });
  new ResizeObserver(() => requestAnimationFrame(sizeCanvas)).observe($('#stagewrap'));
}
function resetSheet() {
  const card = sheet('Start over?', CATS.control.c);
  card.appendChild(el('p', '', 'This brings back the starter project. Your changes will go away.')).style.cssText = 'margin:0;font-size:19px;color:#5B6888';
  const row = el('div', 'rowc'); const yes = el('button', 'okb', 'Yes, start over'); yes.style.background = 'var(--coral)'; const no = el('button', 'pg-ghost', 'No, keep it');
  yes.onclick = () => { closePk(); stopAll(true); undoStack.push(JSON.stringify(P)); P = fillProject(clone(STARTER)); cur = 0; selB = null; cursor = null; RT.sprites = []; syncRT(true); renderAll(); PG.save(P, true); PG.sfx.pop(); };
  no.onclick = closePk; row.append(yes, no); card.appendChild(row);
}
PG.boot(cfg => {
  CFG = cfg || {};
  STARTER = fillProject(clone(validProject(CFG.project) ? CFG.project : { backdrops: [CFG.bg || 'park'], sprites: [{ name: 'Cat', props: ['l1_cat', 'l1_cat_jump'], scripts: [[{ op: 'flag' }, { op: 'sayfor', args: { t: 'Kumusta!', s: 2 } }]] }] }));
  if (CFG.blocks && CFG.blocks.length) { allowed = new Set(); for (const b of CFG.blocks) { if (CATS[b]) Object.keys(D).forEach(op => { if (D[op].c === b) allowed.add(op); }); else if (D[b]) allowed.add(b); } }
  const saved = PG.load(); P = fillProject(clone(validProject(saved) ? saved : STARTER));
  cur = Math.max(0, P.sprites.map(sp => hatScripts(sp).length > 0).lastIndexOf(true));
  buildUI(); syncRT(true); renderAll(); layout();
  document.fonts && document.fonts.load("800 16px 'Baloo 2'").then(() => { dirty = true; });
  PG.onSave = () => PG.save(P);
  requestAnimationFrame(loop);
  window.STG = { get project() { return P; }, RT, ST, flag: greenFlag, stop: stopAll, add: addBlock, sel: selectSprite, selectBlock, key: k => { RT.keys.add(k); fireKey(k); }, keyUp, checkAll, edit, render: renderAll, openPicker, done: doneSet };
});
</script>
